stages:
  - build
  - deploy

variables:
  GIT_SSL_NO_VERIFY: "true"
  
default:
  tags:
    - cinas-deploy

build-site:
  stage: build
  image: ghcr.io/quarto-dev/quarto:latest
  cache:
    key: "cinas-quarto-cache"
    paths:
      - .quarto/
      - _freeze/
  script:
    # Renderiza o site. Se o _quarto.yml já diz que o output é 'docs', ele vai para lá.
    - quarto render 
    - quarto render --profile en
  artifacts:
    paths:
      - docs/ 
  tags:
    - cinas-deploy

deploy-site:
  stage: deploy
  image: alpine:latest
  script:
    # Garante a existência do diretório de dashboards
    - mkdir -p /storage/cinas-website/html/dashboards
    # Limpa o destino no ZFS preservando o diretório dashboards
    - find /storage/cinas-website/html/ -mindepth 1 -maxdepth 1 ! -name 'dashboards' -exec rm -rf {} +
    # Copia o conteúdo do site (docs) para o servidor web
    - cp -R docs/* /storage/cinas-website/html/
    # Copia o dashboard da pasta do usuário para a localização definitiva (se presente)
    - if [ -f "/home/mario/dashboard_cinas/dashboard_cinas_datasus.html" ]; then cp -f /home/mario/dashboard_cinas/dashboard_cinas_datasus.html /storage/cinas-website/html/dashboards/; fi
  only:
    - main
  tags:
    - cinas-deploy
