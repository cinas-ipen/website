stages:
  - build
  - deploy

variables:
  GIT_SSL_NO_VERIFY: "true"
  
default:
  tags:
    - cinas-deploy

build-site:
  stage: build
  image: ghcr.io/quarto-dev/quarto:latest
  cache:
    key: "cinas-quarto-cache"
    paths:
      - .quarto/
      - _freeze/
  script:
    # Renderiza o site. Se o _quarto.yml já diz que o output é 'docs', ele vai para lá.
    - quarto render 
    - quarto render --profile en
  artifacts:
    paths:
      - docs/ 
  tags:
    - cinas-deploy

deploy-site:
  stage: deploy
  image: alpine:latest
  script:
    # Garante a existência do diretório de dashboards
    - mkdir -p /storage/cinas-website/html/dashboards
    # Limpa o destino no ZFS preservando o diretório dashboards
    - find /storage/cinas-website/html/ -mindepth 1 -maxdepth 1 ! -name 'dashboards' -exec rm -rf {} +
    # Copia o conteúdo do site (docs) para o servidor web
    - cp -R docs/* /storage/cinas-website/html/
    # Obtém o GID do servidor web (ex: www-data) a partir da pasta raiz html
    - WEB_GID=$(stat -c '%g' /storage/cinas-website/html)
    # Atribui a posse de todo o site para o usuário mario (UID 1000) e o grupo do servidor web
    - chown -R 1000:${WEB_GID} /storage/cinas-website/html/
    # Define permissões de leitura/escrita (775) para o usuário e grupo web
    - chmod -R 775 /storage/cinas-website/html/
  only:
    - main
  tags:
    - cinas-deploy
